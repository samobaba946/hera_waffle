<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6b1820" />
  <title>Hera Waffle — Tatlı Anlar Burada Başlar</title>
  <meta name="description" content="Hera Waffle menüsü: el yapımı waffle çeşitleri, taze demlenmiş kahveler ve serinletici soğuk içecekler." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%236b1820%22/><text x=%2232%22 y=%2244%22 font-family=%22Georgia,serif%22 font-size=%2240%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%23faf3e7%22>H</text></svg>" />

  <style>
    /* =====================================================
       HERA WAFFLE — STYLES 
    ===================================================== */
    :root {
      --burgundy-deep: #4a0e14;
      --burgundy: #6b1820;
      --burgundy-mid: #7d2230;
      --burgundy-light: #8b2a35;
      --cream: #faf3e7;
      --cream-warm: #f5e9d4;
      --paper: #fffbf5;
      --gold: #d4a045;
      --gold-light: #e8b860;
      --gold-deep: #a87a26;
      --ink: #2a0a0e;
      --ink-soft: #4a2a30;
      --muted: #8a6a72;
      --font-display: "Fraunces", "Playfair Display", Georgia, serif;
      --font-body: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --radius-sm: 10px;
      --radius-md: 18px;
      --radius-lg: 28px;
      --radius-xl: 36px;
      --shadow-sm: 0 2px 8px rgba(74, 14, 20, 0.06);
      --shadow-md: 0 12px 28px -8px rgba(74, 14, 20, 0.18);
      --shadow-lg: 0 28px 60px -12px rgba(74, 14, 20, 0.32);
      --shadow-xl: 0 40px 80px -20px rgba(74, 14, 20, 0.5);
      --container: 1240px;
      --gutter: clamp(1.25rem, 4vw, 3rem);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.55;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ... (Tüm CSS'iniz aynı kalıyor, sadece en sona çilek animasyonunu ekliyorum) ... */

    .strawberry-rain {
      position: fixed;
      z-index: 9999;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      animation: strawberryFall linear forwards;
    }

    @keyframes strawberryFall {
      to {
        transform: translateY(110vh) rotate(720deg) translateX(var(--sway));
        opacity: 0;
      }
    }

    /* ====================== ORİJİNAL CSS'İNİZ DEVAM EDİYOR ====================== */
    .eyebrow { display: inline-block; font-family: var(--font-body); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-deep); }
    .section-title { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.2rem, 5.5vw, 4.2rem); line-height: 1.05; color: var(--burgundy); letter-spacing: -0.02em; }
    .section-title em { font-style: italic; font-weight: 400; color: var(--gold-deep); }

    /* Header, Hero, Menu vb. stilleriniz (kısaltıldı, orijinal kodunuzdaki gibi kalıyor) */
    /* ... Tüm orijinal CSS ... */

  </style>
</head>
<body>
  <!-- ============== HEADER ============== -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="logo" aria-label="Hera Waffle ana sayfa">
        <span class="logo-mark" aria-hidden="true">H</span>
        <span class="logo-text">
          <span class="logo-top">Hera</span>
          <span class="logo-bottom">Waffle</span>
        </span>
      </a>
      <nav class="quick-nav" aria-label="Birincil">
        <a href="#menu">Menü</a>
        <a href="#hakkimizda">Hakkımızda</a>
        <a href="#iletisim">İletişim</a>
      </nav>
    </div>
  </header>

  <!-- ============== HERO ============== -->
  <section class="hero">
    <!-- ... (Hero içeriği aynı) ... -->
    <div class="hero-content">
      <span class="eyebrow" data-anim="1">✦ &nbsp;Tatlı Anlar Burada Başlar&nbsp; ✦</span>
      <h1 class="hero-title" data-anim="2">
        <span class="line"><em>Hera</em></span>
        <span class="line">Waffle</span>
      </h1>
      <p class="hero-subtitle" data-anim="3">El yapımı waffle çeşitleri, özenle demlenen kahveler ve serinletici içecekler.</p>
      <div class="hero-cta" data-anim="4">
        <a href="#menu" class="btn-primary">Menüyü Keşfet</a>
        <a href="#iletisim" class="btn-ghost">İletişim</a>
      </div>
    </div>
  </section>

  <!-- ============== MENU SECTION ============== -->
  <section id="menu" class="menu-section">
    <!-- ... kategori tabları aynı ... -->
    <div class="menu-grid" id="menuGrid"></div>
  </section>

  <!-- Hakkımızda ve Footer aynı kalıyor -->
  <section id="hakkimizda" class="about-strip"> ... </section>
  <footer id="iletisim" class="site-footer"> ... </footer>

  <!-- ============== MODAL ============== -->
  <div class="modal" id="itemModal" aria-hidden="true" role="dialog">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close>✕</button>
      <div class="modal-image-wrap">
        <div class="modal-image-fallback" id="modalImageFallback"></div>
        <img id="modalImage" src="" alt="" />
        <span class="modal-price" id="modalPrice"></span>
      </div>
      <div class="modal-body">
        <span class="eyebrow modal-eyebrow" id="modalEyebrow"></span>
        <h3 class="modal-title" id="modalTitle"></h3>
        <p class="modal-desc" id="modalDesc"></p>
        <div class="modal-section">
          <h4 class="modal-section-title">İçindekiler</h4>
          <div class="modal-ingredients" id="modalIngredients"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      const WAFFLE_FORMATS = [
        { name: "Bardak (2 tane)", price: "200 TL" },
        { name: "Kova", price: "150 TL" }
      ];

      const MENU = [ /* ... TÜM MENÜ VERİLERİNİZ (orijinal haliyle aynı) ... */ 
        // (Buraya orijinal MENU dizinizin tamamını yapıştırın)
        // ... (kısaltıldı, orijinal dosyanızdaki MENU array'inin tamamı buraya gelecek)
      ];

      // DOM Elements
      const grid = document.getElementById("menuGrid");
      const modal = document.getElementById("itemModal");
      const modalImage = document.getElementById("modalImage");
      const modalImageFallback = document.getElementById("modalImageFallback");
      const modalPrice = document.getElementById("modalPrice");
      const modalEyebrow = document.getElementById("modalEyebrow");
      const modalTitle = document.getElementById("modalTitle");
      const modalDesc = document.getElementById("modalDesc");
      const modalIngredients = document.getElementById("modalIngredients");

      const categoryLabel = {
        waffle: "Waffle",
        kahve: "Kahve",
        soguk: "Soğuk İçecek",
        cay: "Çay"
      };

      function escapeHTML(str) {
        return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      function priceChipHTML(item) {
        if (item.formats && item.formats.length) {
          const nums = item.formats.map(f => f.price.replace(/\s*TL\s*/i, "").trim()).join(" / ");
          return `<span class="card-price two-line"><span class="price-main">${escapeHTML(nums)} TL</span><span class="price-sub">Bardak / Kova</span></span>`;
        }
        return `<span class="card-price">${escapeHTML(item.price)}</span>`;
      }

      /* ========== ÇİLEK YAĞMURU FONKSİYONU ========== */
      function createStrawberryRain() {
        const duration = 4500;
        document.querySelectorAll('.strawberry-rain').forEach(el => el.remove());

        for (let i = 0; i < 85; i++) {
          const s = document.createElement('div');
          s.className = 'strawberry-rain';
          s.textContent = '🍓';
          s.style.fontSize = `${Math.random() * 28 + 24}px`;
          s.style.left = `${Math.random() * 100}vw`;
          s.style.top = `-${Math.random() * 80}px`;
          s.style.opacity = Math.random() * 0.6 + 0.65;
          s.style.transform = `rotate(${Math.random() * 360}deg)`;
          s.style.animationDuration = `${Math.random() * 2 + 2.8}s`;
          s.style.animationDelay = `${Math.random() * 1}s`;
          s.style.setProperty('--sway', `${Math.random() * 90 - 45}px`);
          document.body.appendChild(s);

          setTimeout(() => s.remove(), duration + 3000);
        }
      }

      function renderMenu(category) {
        const items = MENU.filter(it => it.category === category);
        grid.innerHTML = "";

        items.forEach((item, i) => {
          const card = document.createElement("article");
          card.className = "menu-card";
          card.style.animationDelay = `${0.06 * i}s`;
          card.setAttribute("role", "button");
          card.setAttribute("tabindex", "0");

          // ... card innerHTML (orijinalinizdeki gibi) ...

          card.addEventListener("click", () => openModal(item));
          grid.appendChild(card);
        });
      }

      function openModal(item) {
        modalEyebrow.textContent = categoryLabel[item.category] || "";
        modalTitle.textContent = item.name;
        modalDesc.textContent = item.desc;

        if (item.formats && item.formats.length) {
          const nums = item.formats.map(f => f.price.replace(/\s*TL\s*/i, "").trim()).join(" / ");
          modalPrice.textContent = `${nums} TL`;
        } else {
          modalPrice.textContent = item.price;
        }

        modalImage.src = item.image;
        modalImage.alt = item.name;

        // === PRENSES ÇİLEK YAĞMURU ===
        if (item.id === "w-prenses") {
          createStrawberryRain();
        }

        // Modal içeriği (ingredients vs.)
        let html = "";
        if (item.formats && item.formats.length) {
          html += `<div class="modal-formats">` + item.formats.map(f => `
            <div class="format-chip">
              <span class="format-chip-name">${f.name}</span>
              <span class="format-chip-price">${f.price}</span>
            </div>`).join("") + `</div>`;
        }
        html += item.ingredients.map(ing => `
          <span class="ingredient-chip">
            <span class="ing-icon">${ing.icon}</span>
            <span>${ing.name}</span>
          </span>`).join("");
        modalIngredients.innerHTML = html;

        modal.classList.add("is-open");
      }

      // Modal kapatma
      modal.addEventListener("click", e => {
        if (e.target.closest("[data-close]")) modal.classList.remove("is-open");
      });
      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && modal.classList.contains("is-open")) modal.classList.remove("is-open");
      });

      // Init
      renderMenu("waffle");
    })();
  </script>
</body>
</html>
